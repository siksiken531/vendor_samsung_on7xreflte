name: Final Build - Treble Vendor + ArrowOS 13.1 GSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Vendor
        run: |
          mkdir -p vendor_package/vendor
          cp -r proprietary/* vendor_package/vendor/
          cd vendor_package
          zip -r ../vendor.zip *
          cd ..

      - name: Download ArrowOS 13.1 GSI
        run: |
          GSI_URL="https://github.com/naz664/ArrowOS_gsi/releases/download/v2023.10.28/ArrowOS-13.1-arm64_bgN-Unofficial.img.xz"
          wget -O gsi.img.xz $GSI_URL
          unxz gsi.img.xz
          mv gsi.img system.img

      - name: Package Everything
        run: |
          mkdir -p release
          cp vendor.zip release/
          cp system.img release/
          cd release
          zip -r ../SM-G611F_ArrowOS13_Treble.zip *
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-G611F_ArrowOS13_Treble
          path: SM-G611F_ArrowOS13_Treble.zip
